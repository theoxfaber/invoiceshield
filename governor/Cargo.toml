[package]
name = "invoiceshield-governor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed pre-payment gate for AI accounts-payable agents"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
subtle = "2"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "governor-server"
path = "src/bin/server.rs"
