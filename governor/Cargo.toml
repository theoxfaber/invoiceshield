[package]
name = "invoiceshield-governor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed pre-payment gate for AI accounts-payable agents"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
subtle = "2"
# Phase 3 (durable state): SQLite with the C library compiled in, online backup API.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# Phase 3 (anchoring): Ed25519 signatures over the audit chain head.
ed25519-dalek = "2"
getrandom = "0.2"
# Phase 2 (trust boundary): signed extractor envelopes carry base64 signatures.
base64 = "0.22"
# Phase 6 (ops): structured JSON logs
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std", "ansi"] }

[dev-dependencies]
proptest = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[[bin]]
name = "governor-server"
path = "src/bin/server.rs"

[[bin]]
name = "governor"
path = "src/bin/governor.rs"
# Indian digit grouping (1_00_000 = one lakh) is intentional in amounts and fixtures.
[lints.clippy]
inconsistent_digit_grouping = "allow"
