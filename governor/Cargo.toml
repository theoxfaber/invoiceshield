[package]
name = "invoiceshield-governor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed pre-payment gate for AI accounts-payable agents"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"

[dev-dependencies]
proptest = "1"
