name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt whole crate, clippy, test, release build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governor
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: governor
      - name: cargo fmt --check (whole crate, gating)
        run: cargo fmt --check
      - name: clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: release build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: governor-bin
          path: |
            governor/target/release/governor-server
            governor/target/release/governor
          if-no-files-found: warn
          retention-days: 3

  python:
    name: Python (ruff, pytest, offline demo, load smoke)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System packages (OCR for scan/photo variants)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: governor-bin
          path: governor/target/release
      - run: chmod +x governor/target/release/*
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python -m pytest
      - name: Offline demo replay (no API key; committed eval/cache)
        run: python -m eval.demo
      - name: Load smoke (writes to runner temp, not committed)
        run: python -m eval.load_test --levels 4 --seconds 3 --warmup 1 --out "$RUNNER_TEMP/load-ci.json"

  audit:
    name: Dependency audit (cargo audit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: governor
        run: cargo audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: pip-audit
        run: pip-audit -r requirements.txt --progress-spinner off

  docker:
    name: Docker image (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: invoiceshield:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fail-fast config check (no API key / no extractor pubkey -> exit 2)
        run: |
          set +e
          docker run --rm invoiceshield:ci; code=$?
          test "$code" = 2 || { echo "expected exit 2, got $code"; exit 1; }
          docker run --rm -e GOVERNOR_API_KEY=ci-key-0123456789abcdef invoiceshield:ci; code=$?
          test "$code" = 2 || { echo "expected exit 2 without GOVERNOR_EXTRACTOR_PUBKEY, got $code"; exit 1; }
      - name: Governor container answers /healthz, /readyz, /metrics as non-root
        run: |
          # Extractor key generated in the image (as docker-compose's extractor-key does); only the public key reaches the governor.
          PUB=$(docker run --rm invoiceshield:ci python -c "from extractor import signing; print(signing.public_hex(signing.generate().public_key()))")
          docker run -d --name gov -e GOVERNOR_API_KEY=ci-key-0123456789abcdef -e GOVERNOR_EXTRACTOR_PUBKEY="$PUB" -p 127.0.0.1:8080:8080 invoiceshield:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/metrics | grep governor_ready
          test "$(docker exec gov id -u)" = 10001
          docker logs gov | head -5
          docker rm -f gov

  compose:
    name: Docker compose smoke (governor + sandbox, no model key)
    runs-on: ubuntu-latest
    env:
      GOVERNOR_API_KEY: ci-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: docker compose --profile sandbox config -q
      - name: Governor via compose (extractor-key one-shot, then governor healthy)
        run: |
          docker compose up -d --build --wait --wait-timeout 600 governor
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/readyz
      - name: Sandbox via compose (synthetic samples; no BASETEN_API_KEY, so every request is REVIEW at most)
        run: |
          docker compose --profile sandbox up -d --wait --wait-timeout 300 sandbox
          curl -fsS http://127.0.0.1:8001/api/counter | tee counter.json
          python3 -c "import json; c=json.load(open('counter.json')); assert c['spend_cap_usd'] < 10, c; assert c['model_calls_lifetime_cap'] >= 0"
          curl -fsS -X POST "http://127.0.0.1:8001/api/try?sample=bank-swap" | tee try.json
          python3 -c "import json; r=json.load(open('try.json')); assert r['verdict'] in ('REVIEW','BLOCK'), r['verdict']; assert r['model']['used'] is False"
          curl -fsS -X POST "http://127.0.0.1:8001/api/try?sample=genuine-1" | tee try2.json
          python3 -c "import json; r=json.load(open('try2.json')); assert r['verdict'] == 'REVIEW', r['verdict']"
          curl -fsS http://127.0.0.1:8001/api/counter | python3 -c "import json,sys; c=json.load(sys.stdin); assert c['attempts'] == 2 and c['paid'] == 0 and c['paid_to_wrong_account'] == 0, c"
      - name: Logs
        if: always()
        run: docker compose --profile sandbox logs --no-color | tail -200
      - name: Down
        if: always()
        run: docker compose --profile sandbox down -v
